name: Desktop installers
on:
  workflow_dispatch:
    inputs:
      version:
        description: Release version
        default: '1.2.0'
        required: true
permissions:
  contents: read
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-latest
            platform: windows-x64
          - runner: macos-15-intel
            platform: macos-x64
          - runner: macos-15
            platform: macos-arm64
          - runner: ubuntu-22.04
            platform: linux-x64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install Linux build tools
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ruby ruby-dev build-essential rpm libarchive-tools xvfb xauth libx11-6 libxext6 libxrender1 libxft2 libxcb1 fontconfig
          sudo gem install fpm -v 1.17.0 --no-document
      - run: python -m pip install pyinstaller==6.22.3 pillow==12.0.0
      - name: Check source on Windows and macOS
        if: runner.os != 'Linux'
        run: python smoke_check.py
      - name: Check source on Linux
        if: runner.os == 'Linux'
        run: xvfb-run -a python smoke_check.py
      - name: Build and check packaged app
        if: runner.os != 'Linux'
        env:
          VERSION: ${{ inputs.version }}
        run: python build_release.py "$env:VERSION"
        shell: pwsh
      - name: Build and check Linux packages
        if: runner.os == 'Linux'
        env:
          VERSION: ${{ inputs.version }}
        run: xvfb-run -a python build_release.py "$VERSION"
      - uses: actions/upload-artifact@v4
        with:
          name: pocket-${{ matrix.platform }}
          path: release/*
  linux-check:
    needs: build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - distro: debian
            image: debian:13
          - distro: fedora
            image: fedora:43
          - distro: arch
            image: archlinux:base
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: pocket-linux-x64
          path: artifacts
      - name: Install package and test on distribution
        env:
          IMAGE: ${{ matrix.image }}
          DISTRO: ${{ matrix.distro }}
        run: docker run --rm -v "$PWD:/source:ro" -v "$PWD/artifacts:/artifacts:ro" "$IMAGE" bash /source/check_linux.sh "$DISTRO"
  publish:
    needs: [build, linux-check]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: pocket-*
          path: artifacts
          merge-multiple: true
      - name: Publish tested installers
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
        run: |
          gh release create "v$VERSION" artifacts/PocketGuideInstaller-* INSTALL.md CREDITS.md --target "$GITHUB_SHA" --title "Pocket Guide Installer $VERSION" --notes-file RELEASE_NOTES.md
